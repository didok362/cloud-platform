apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-engine
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/didok362/cloud-platform
    targetRevision: HEAD
    path: gitops/services/chat-engine
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true