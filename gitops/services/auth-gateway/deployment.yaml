apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-gateway
  labels:
    app: auth-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-gateway
  template:
    metadata:
      labels:
        app: auth-gateway
    spec:
      containers:
        - name: auth-gateway
          image: ghcr.io/didok362/cloud-platform/auth-gateway:sha-e55bc47
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          env:
            - name: PORT
              value: "8080"
            - name: CHAT_ENGINE_ADDR
              value: "chat-engine:50051"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5